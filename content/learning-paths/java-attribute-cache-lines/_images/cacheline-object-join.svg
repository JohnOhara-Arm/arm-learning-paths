<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Cache-line to Java object attribution workflow</title>
  <desc id="desc">Perf C2C cache lines and a paused JVM snapshot are combined to identify Java objects, then JOL identifies fields and adjacency.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5bd6"/>
    </marker>
    <style>
      .box { fill: #f7f7fb; stroke: #5b5bd6; stroke-width: 2; rx: 10; }
      .heading { font: 600 18px sans-serif; fill: #1f1f2e; text-anchor: middle; }
      .detail { font: 14px sans-serif; fill: #333344; text-anchor: middle; }
      .arrow { stroke: #5b5bd6; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="25" y="45" width="190" height="150"/>
  <text class="heading" x="120" y="82">Perf C2C</text>
  <text class="detail" x="120" y="115">hot line address</text>
  <text class="detail" x="120" y="140">peer/HITM evidence</text>
  <text class="detail" x="120" y="165">PC and CPU</text>

  <rect class="box" x="265" y="45" width="190" height="150"/>
  <text class="heading" x="360" y="82">Paused JVM</text>
  <text class="detail" x="360" y="115">maps and pagemap</text>
  <text class="detail" x="360" y="140">object address</text>
  <text class="detail" x="360" y="165">size and class</text>

  <rect class="box" x="505" y="45" width="190" height="150"/>
  <text class="heading" x="600" y="82">Address join</text>
  <text class="detail" x="600" y="115">virtual or physical</text>
  <text class="detail" x="600" y="140">same GC epoch</text>
  <text class="detail" x="600" y="165">line → objects</text>

  <rect class="box" x="745" y="45" width="190" height="150"/>
  <text class="heading" x="840" y="82">JOL result</text>
  <text class="detail" x="840" y="115">field overlap</text>
  <text class="detail" x="840" y="140">object boundary</text>
  <text class="detail" x="840" y="165">adjacency class</text>

  <line class="arrow" x1="215" y1="120" x2="255" y2="120"/>
  <line class="arrow" x1="455" y1="120" x2="495" y2="120"/>
  <line class="arrow" x1="695" y1="120" x2="735" y2="120"/>
</svg>
