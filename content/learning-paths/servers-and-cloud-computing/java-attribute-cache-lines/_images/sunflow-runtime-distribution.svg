<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Direct Sunflow runtime distributions</title>
  <desc id="desc">Horizontal box plots for 24 runs of each variant. Baseline spans 10.779 to 29.585 seconds with a median of 18.427 seconds. JVM-default 128-byte padding spans 8.015 to 12.511 seconds with a median of 8.880 seconds. Explicit 64-byte padding spans 7.235 to 10.476 seconds with a median of 8.195 seconds. Every run passed image validation.</desc>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Validated Sunflow runtime, 24 runs per variant</text>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="210" y1="70" x2="210" y2="365"/>
    <line x1="363" y1="70" x2="363" y2="365"/>
    <line x1="515" y1="70" x2="515" y2="365"/>
    <line x1="668" y1="70" x2="668" y2="365"/>
    <line x1="820" y1="70" x2="820" y2="365"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#374151">
    <text x="210" y="392" text-anchor="middle">0</text>
    <text x="363" y="392" text-anchor="middle">8</text>
    <text x="515" y="392" text-anchor="middle">16</text>
    <text x="668" y="392" text-anchor="middle">24</text>
    <text x="820" y="392" text-anchor="middle">32</text>
    <text x="515" y="424" text-anchor="middle">Elapsed time (seconds)</text>
    <text x="185" y="137" text-anchor="end">Baseline</text>
    <text x="185" y="237" text-anchor="end">JVM default (128 B)</text>
    <text x="185" y="337" text-anchor="end">Explicit 64 B</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="416" y1="130" x2="774" y2="130"/>
    <line x1="416" y1="113" x2="416" y2="147"/>
    <line x1="774" y1="113" x2="774" y2="147"/>
    <rect x="505" y="101" width="192" height="58" fill="#dbeafe"/>
    <line x1="561" y1="101" x2="561" y2="159" stroke="#1d4ed8" stroke-width="5"/>

    <line x1="363" y1="230" x2="449" y2="230"/>
    <line x1="363" y1="213" x2="363" y2="247"/>
    <line x1="449" y1="213" x2="449" y2="247"/>
    <rect x="372" y="201" width="28" height="58" fill="#fef3c7"/>
    <line x1="379" y1="201" x2="379" y2="259" stroke="#b45309" stroke-width="5"/>

    <line x1="348" y1="330" x2="410" y2="330"/>
    <line x1="348" y1="313" x2="348" y2="347"/>
    <line x1="410" y1="313" x2="410" y2="347"/>
    <rect x="360" y="301" width="17" height="58" fill="#dcfce7"/>
    <line x1="366" y1="301" x2="366" y2="359" stroke="#15803d" stroke-width="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="561" y="91" text-anchor="middle">median 18.427 s</text>
    <text x="379" y="191" text-anchor="middle">median 8.880 s</text>
    <text x="366" y="291" text-anchor="middle">median 8.195 s</text>
  </g>
</svg>
