<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Direct Sunflow runtime distributions</title>
  <desc id="desc">Horizontal box plots for 20 baseline and 20 all-captured-classes fixed runs. Baseline spans 11 to 25 seconds with a median of 19 seconds. Fixed spans 6.9 to 12 seconds with a median of 7.1 seconds. Every run passed image validation.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Validated Sunflow runtime, 20 runs per variant</text>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="210" y1="70" x2="210" y2="285"/><line x1="327" y1="70" x2="327" y2="285"/>
    <line x1="444" y1="70" x2="444" y2="285"/><line x1="561" y1="70" x2="561" y2="285"/>
    <line x1="678" y1="70" x2="678" y2="285"/><line x1="795" y1="70" x2="795" y2="285"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#374151">
    <text x="210" y="312" text-anchor="middle">0</text><text x="327" y="312" text-anchor="middle">5</text>
    <text x="444" y="312" text-anchor="middle">10</text><text x="561" y="312" text-anchor="middle">15</text>
    <text x="678" y="312" text-anchor="middle">20</text><text x="795" y="312" text-anchor="middle">25</text>
    <text x="500" y="342" text-anchor="middle">Elapsed time (seconds)</text>
    <text x="185" y="137" text-anchor="end">Baseline</text>
    <text x="185" y="237" text-anchor="end">All-captured fixed</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="464" y1="130" x2="784" y2="130"/><line x1="464" y1="113" x2="464" y2="147"/><line x1="784" y1="113" x2="784" y2="147"/>
    <rect x="614" y="101" width="88" height="58" fill="#dbeafe"/><line x1="651" y1="101" x2="651" y2="159" stroke="#1d4ed8" stroke-width="5"/>
    <line x1="372" y1="230" x2="482" y2="230"/><line x1="372" y1="213" x2="372" y2="247"/><line x1="482" y1="213" x2="482" y2="247"/>
    <rect x="374" y="201" width="5" height="58" fill="#dcfce7"/><line x1="377" y1="201" x2="377" y2="259" stroke="#15803d" stroke-width="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="651" y="91" text-anchor="middle">median 19 s</text>
    <text x="377" y="191" text-anchor="middle">median 7.1 s</text>
  </g>
</svg>
